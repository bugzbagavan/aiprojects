name: AI Test Plannerr

on:
  push:

jobs:
  test-planner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        shell: bash
        run: |
          echo "================================"
          echo "AI Test Planner - Change Detection"
          echo "================================"

          CURRENT_COMMIT="${{ github.sha }}"
          PREVIOUS_COMMIT="${{ github.event.before }}"

          echo "Previous commit: $PREVIOUS_COMMIT"
          echo "Current commit:  $CURRENT_COMMIT"
          echo ""

          echo "Changed files:"
          echo "--------------------------------"

          if [ "$PREVIOUS_COMMIT" = "0000000000000000000000000000000000000000" ]; then
            git ls-files --name-status
          else
            git diff --name-status "$PREVIOUS_COMMIT" "$CURRENT_COMMIT"
          fi

          echo ""
          echo "================================"
          echo "Actual code diff"
          echo "================================"

          if [ "$PREVIOUS_COMMIT" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --no-commit-id --name-status -r "$CURRENT_COMMIT"
            git show --format=fuller --no-ext-diff "$CURRENT_COMMIT" > change-diff.txt
          else
            git diff "$PREVIOUS_COMMIT" "$CURRENT_COMMIT" > change-diff.txt
          fi

          echo ""
          echo "Diff saved to change-diff.txt"
          echo "Diff size:"
          wc -c change-diff.txt

      - name: Upload change diff
        uses: actions/upload-artifact@v4
        with:
          name: change-diff
          path: change-diff.txt

      - name: Build AI planner input
        shell: bash
        run: |
          echo "# AI Test Planner Input" > test-planner-input.md
          echo "" >> test-planner-input.md

          echo "## Project Documentation" >> test-planner-input.md
          echo "" >> test-planner-input.md
          cat tab-recorder-extension/README.md >> test-planner-input.md

          echo "" >> test-planner-input.md
          echo "---" >> test-planner-input.md
          echo "" >> test-planner-input.md

          echo "## Changed Files" >> test-planner-input.md
          echo "" >> test-planner-input.md

          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git ls-files --name-status >> test-planner-input.md
          else
            git diff --name-status "${{ github.event.before }}" "${{ github.sha }}" >> test-planner-input.md
          fi

          echo "" >> test-planner-input.md
          echo "---" >> test-planner-input.md
          echo "" >> test-planner-input.md

          echo "## Git Diff" >> test-planner-input.md
          echo "" >> test-planner-input.md
          cat change-diff.txt >> test-planner-input.md

          echo "" 
          echo "AI planner input created:"
          wc -c test-planner-input.md

      - name: Upload planner input
        uses: actions/upload-artifact@v4
        with:
          name: test-planner-input
          path: test-planner-input.md

      - name: Generate test plan and specification with Mistral
        shell: bash
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          echo "================================"
          echo "Generating test plan and specification"
          echo "================================"

          python3 - <<'PY'
          import json
          import os
          import random
          import time
          import urllib.error
          import urllib.request

          # ============================================================
          # AZURE AI FOUNDRY / OPENAI-COMPATIBLE CONFIGURATION
          # ============================================================

          API_KEY = os.environ["MISTRAL_API_KEY"]

          AZURE_ENDPOINT = (
              "https://hcideepseek.services.ai.azure.com/openai/v1/"
          )

          DEPLOYMENT_NAME = "mistral-small-2503-2"

          API_URL = (
              AZURE_ENDPOINT.rstrip("/")
              + "/chat/completions"
          )

          INPUT_FILE = "test-planner-input.md"
          TEST_PLAN_FILE = "test-plan.md"
          TEST_SPEC_FILE = "test-spec.json"

          # ============================================================
          # TOKEN OPTIMIZATION
          # ============================================================

          # Keep the project context reasonably small.
          MAX_INPUT_CHARS = 16000

          # Limit the generated response.
          MAX_OUTPUT_TOKENS = 3000

          if not os.path.isfile(INPUT_FILE):
              raise RuntimeError(
                  f"Required input file not found: {INPUT_FILE}"
              )

          with open(
              INPUT_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              original_input = f.read()

          original_size = len(original_input)

          print("")
          print("Original input size:")
          print(f"{original_size} characters")

          if original_size > MAX_INPUT_CHARS:

              compact_input = (
                  original_input[:MAX_INPUT_CHARS]
                  + "\n\n"
                  + "[INPUT TRUNCATED FOR TOKEN OPTIMIZATION]\n"
                  + "Focus only on the project information provided "
                  + "above. Do not assume information that is not present."
              )

              print("")
              print("Input exceeds configured limit.")
              print(
                  f"Truncating input to "
                  f"{MAX_INPUT_CHARS} characters."
              )

          else:
              compact_input = original_input

          print("")
          print("Final model input size:")
          print(f"{len(compact_input)} characters")

          print("")
          print("AI API calls for this workflow: 1")

          print("")
          print("Azure endpoint:")
          print(AZURE_ENDPOINT)

          print("")
          print("Deployment:")
          print(DEPLOYMENT_NAME)

          # ============================================================
          # PROMPT
          # ============================================================

          system_prompt = """
          You are an expert software QA and test automation engineer.

          Analyze the supplied project context and create a practical,
          concise test specification.

          Return ONLY valid JSON.

          Do not use markdown.

          Do not add explanations outside the JSON.

          The JSON must use exactly this structure:

          {
            "project": "project name",
            "tests": [
              {
                "id": "TC-001",
                "title": "short test title",
                "priority": "P0",
                "category": "functional",
                "steps": [
                  "step 1",
                  "step 2"
                ],
                "expected_result": "expected result",
                "affected_files": [
                  "file/path"
                ],
                "automation_candidate": true
              }
            ]
          }

          Rules:

          1. Generate practical test cases based only on the supplied
             project context.

          2. Use sequential IDs:
             TC-001, TC-002, TC-003, and so on.

          3. Use only these priorities:
             P0, P1, P2, P3.

          4. Use only these categories:
             functional,
             ui_ux,
             performance,
             compatibility,
             regression.

          5. Set automation_candidate to true only when the test can
             reasonably be automated.

          6. Set automation_candidate to false when the test requires
             manual validation.

          7. Keep steps concise.

          8. Avoid duplicate test cases.

          9. Do not generate unnecessary test cases.

          10. Prefer high-value tests covering changed or affected areas.

          11. Return valid JSON only.

          12. Do not wrap the JSON in markdown code fences.
          """

          user_prompt = """
          PROJECT CONTEXT:

          """ + compact_input

          # ============================================================
          # SINGLE API REQUEST
          # ============================================================

          # IMPORTANT:
          #
          # The Azure AI Foundry OpenAI-compatible API expects the
          # deployment name in the "model" field.
          #
          # We intentionally do NOT use response_format here because
          # model/provider support for JSON response formats can vary.
          #
          # The workflow validates the returned JSON itself.
          #

          payload_data = {
              "model": DEPLOYMENT_NAME,
              "messages": [
                  {
                      "role": "system",
                      "content": system_prompt
                  },
                  {
                      "role": "user",
                      "content": user_prompt
                  }
              ],
              "temperature": 0,
              "max_tokens": MAX_OUTPUT_TOKENS
          }

          payload = json.dumps(
              payload_data
          ).encode("utf-8")

          # ============================================================
          # API REQUEST WITH RETRY
          # ============================================================

          MAX_ATTEMPTS = 4

          result = None

          for attempt in range(
              1,
              MAX_ATTEMPTS + 1
          ):

              print("")
              print(
                  f"AI request attempt "
                  f"{attempt}/{MAX_ATTEMPTS}"
              )

              request = urllib.request.Request(
                  API_URL,
                  data=payload,
                  headers={
                      "Authorization":
                          f"Bearer {API_KEY}",
                      "Content-Type":
                          "application/json"
                  },
                  method="POST"
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=180
                  ) as response:

                      response_body = (
                          response.read().decode(
                              "utf-8"
                          )
                      )

                      result = json.loads(
                          response_body
                      )

                  print("")
                  print(
                      "AI request succeeded."
                  )

                  break

              except urllib.error.HTTPError as e:

                  body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("")
                  print(
                      f"AI HTTP error: {e.code}"
                  )

                  print(
                      f"Response: {body[:2000]}"
                  )

                  # ----------------------------------------------------
                  # RATE LIMIT
                  # ----------------------------------------------------

                  if e.code == 429:

                      if attempt == MAX_ATTEMPTS:

                          print("")
                          print(
                              "ERROR: API rate limit was exceeded."
                          )

                          print(
                              "All retry attempts were exhausted."
                          )

                          raise

                      delay = (
                          15 * (2 ** (attempt - 1))
                      ) + random.uniform(0, 3)

                      print("")
                      print(
                          "Rate limit encountered."
                      )

                      print(
                          f"Retrying in "
                          f"{delay:.1f} seconds..."
                      )

                      time.sleep(delay)

                      continue

                  # ----------------------------------------------------
                  # TRANSIENT SERVER ERRORS
                  # ----------------------------------------------------

                  if e.code in (
                      500,
                      502,
                      503,
                      504
                  ):

                      if attempt == MAX_ATTEMPTS:
                          raise

                      delay = (
                          5 * (2 ** (attempt - 1))
                      ) + random.uniform(0, 2)

                      print("")
                      print(
                          "Transient server error."
                      )

                      print(
                          f"Retrying in "
                          f"{delay:.1f} seconds..."
                      )

                      time.sleep(delay)

                      continue

                  # ----------------------------------------------------
                  # OTHER HTTP ERRORS
                  # ----------------------------------------------------

                  print("")
                  print(
                      "Non-retryable HTTP error encountered."
                  )

                  raise

              except urllib.error.URLError as e:

                  print("")
                  print(
                      f"Network error: {e}"
                  )

                  if attempt == MAX_ATTEMPTS:
                      raise

                  delay = (
                      5 * (2 ** (attempt - 1))
                  ) + random.uniform(0, 2)

                  print(
                      f"Retrying in "
                      f"{delay:.1f} seconds..."
                  )

                  time.sleep(delay)

          if result is None:
              raise RuntimeError(
                  "AI service returned no response."
              )

          # ============================================================
          # EXTRACT RESPONSE
          # ============================================================

          try:

              content = (
                  result["choices"][0]
                  ["message"]["content"]
              )

          except (
              KeyError,
              IndexError,
              TypeError
          ):

              print("")
              print(
                  "ERROR: Unexpected API response."
              )

              print("")
              print(
                  json.dumps(
                      result,
                      indent=2
                  )[:5000]
              )

              raise RuntimeError(
                  "Unable to extract model response."
              )

          if not isinstance(content, str):

              raise RuntimeError(
                  "Model response content is not a string."
              )

          content = content.strip()

          if not content:

              raise RuntimeError(
                  "Model returned empty content."
              )

          # ============================================================
          # REMOVE MARKDOWN FENCES IF PRESENT
          # ============================================================

          if content.startswith("```"):

              lines = content.splitlines()

              if lines and lines[0].startswith("```"):
                  lines = lines[1:]

              if (
                  lines
                  and lines[-1].strip() == "```"
              ):
                  lines = lines[:-1]

              content = "\n".join(
                  lines
              ).strip()

          # ============================================================
          # VALIDATE JSON
          # ============================================================

          try:

              specification = json.loads(
                  content
              )

          except json.JSONDecodeError:

              print("")
              print(
                  "ERROR: Model returned invalid JSON."
              )

              print("")
              print(
                  "Response preview:"
              )

              print(
                  content[:5000]
              )

              raise

          if not isinstance(
              specification,
              dict
          ):

              raise ValueError(
                  "Specification root must be "
                  "a JSON object."
              )

          if "project" not in specification:

              raise ValueError(
                  "Specification missing 'project'."
              )

          if "tests" not in specification:

              raise ValueError(
                  "Specification missing 'tests'."
              )

          if not isinstance(
              specification["tests"],
              list
          ):

              raise ValueError(
                  "'tests' must be an array."
              )

          if not specification["tests"]:

              raise ValueError(
                  "Model generated zero test cases."
              )

          # ============================================================
          # NORMALIZE AND VALIDATE TEST CASES
          # ============================================================

          required_fields = [
              "id",
              "title",
              "priority",
              "category",
              "steps",
              "expected_result",
              "affected_files",
              "automation_candidate"
          ]

          valid_priorities = {
              "P0",
              "P1",
              "P2",
              "P3"
          }

          valid_categories = {
              "functional",
              "ui_ux",
              "performance",
              "compatibility",
              "regression"
          }

          seen_ids = set()

          for index, test_case in enumerate(
              specification["tests"],
              start=1
          ):

              if not isinstance(
                  test_case,
                  dict
              ):

                  raise ValueError(
                      f"Test case {index} "
                      "is not an object."
                  )

              for field in required_fields:

                  if field not in test_case:

                      raise ValueError(
                          f"Test case {index} "
                          f"is missing '{field}'."
                      )

              test_id = test_case["id"]

              if not isinstance(
                  test_id,
                  str
              ):

                  raise ValueError(
                      f"Test case {index} "
                      "has an invalid ID."
                  )

              if test_id in seen_ids:

                  raise ValueError(
                      f"Duplicate test ID: "
                      f"{test_id}"
                  )

              seen_ids.add(test_id)

              if (
                  test_case["priority"]
                  not in valid_priorities
              ):

                  raise ValueError(
                      f"{test_id} has invalid "
                      "priority."
                  )

              if (
                  test_case["category"]
                  not in valid_categories
              ):

                  raise ValueError(
                      f"{test_id} has invalid "
                      "category."
                  )

              if not isinstance(
                  test_case["steps"],
                  list
              ):

                  raise ValueError(
                      f"{test_id} steps "
                      "must be an array."
                  )

              if not isinstance(
                  test_case["affected_files"],
                  list
              ):

                  raise ValueError(
                      f"{test_id} affected_files "
                      "must be an array."
                  )

              if not isinstance(
                  test_case[
                      "automation_candidate"
                  ],
                  bool
              ):

                  raise ValueError(
                      f"{test_id} "
                      "automation_candidate "
                      "must be boolean."
                  )

          # ============================================================
          # SAVE test-spec.json
          # ============================================================

          with open(
              TEST_SPEC_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  specification,
                  f,
                  indent=2
              )

          print("")
          print(
              "Automated test specification created."
          )

          print(
              f"Test cases: "
              f"{len(specification['tests'])}"
          )

          # ============================================================
          # CREATE test-plan.md LOCALLY
          # ============================================================

          # No second AI API call is made.

          lines = []

          lines.append(
              "# Generated Test Plan"
          )

          lines.append("")

          lines.append(
              "## Project"
          )

          lines.append("")

          lines.append(
              str(
                  specification["project"]
              )
          )

          lines.append("")

          lines.append(
              "## Test Cases"
          )

          lines.append("")

          for test_case in specification["tests"]:

              lines.append(
                  f"### {test_case['id']} - "
                  f"{test_case['title']}"
              )

              lines.append("")

              lines.append(
                  f"- **Priority:** "
                  f"{test_case['priority']}"
              )

              lines.append(
                  f"- **Category:** "
                  f"{test_case['category']}"
              )

              lines.append(
                  f"- **Automation Candidate:** "
                  f"{str(test_case['automation_candidate']).lower()}"
              )

              lines.append("")

              lines.append(
                  "**Steps:**"
              )

              for step_number, step in enumerate(
                  test_case["steps"],
                  start=1
              ):

                  lines.append(
                      f"{step_number}. {step}"
                  )

              lines.append("")

              lines.append(
                  "**Expected Result:**"
              )

              lines.append(
                  str(
                      test_case[
                          "expected_result"
                      ]
                  )
              )

              lines.append("")

              if (
                  test_case[
                      "affected_files"
                  ]
              ):

                  lines.append(
                      "**Affected Files:**"
                  )

                  for affected_file in (
                      test_case[
                          "affected_files"
                      ]
                  ):

                      lines.append(
                          f"- {affected_file}"
                      )

                  lines.append("")

          test_plan = "\n".join(
              lines
          )

          with open(
              TEST_PLAN_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  test_plan
              )

          print("")
          print(
              "Human-readable test plan "
              "created locally."
          )

          print("")
          print(
              "================================"
          )

          print(
              "AI processing completed."
          )

          print(
              "================================"
          )

          print("")
          print(
              "API calls used: 1"
          )

          print(
              f"Maximum input size: "
              f"{MAX_INPUT_CHARS} characters"
          )

          print(
              f"Maximum output size: "
              f"{MAX_OUTPUT_TOKENS} tokens"
          )

          print(
              f"Generated test cases: "
              f"{len(specification['tests'])}"
          )
          PY

          echo ""
          echo "================================"
          echo "Generated files"
          echo "================================"

          echo ""

          echo "test-plan.md:"
          wc -c test-plan.md

          echo ""

          echo "test-spec.json:"
          wc -c test-spec.json

          echo ""

          echo "Test specification preview:"
          head -80 test-spec.json
          
      - name: Upload test plan
        uses: actions/upload-artifact@v4
        with:
          name: generated-test-plan
          path: test-plan.md          

      - name: Validate generated test specification
        shell: bash
        run: |
          echo "================================"
          echo "Validating generated test specification"
          echo "================================"

          jq empty test-spec.json

          TEST_COUNT=$(jq '.tests | length' test-spec.json)

          echo "Valid JSON"
          echo "Test cases: $TEST_COUNT"

          jq -e '
            .project and
            (.tests | type == "array") and
            all(.tests[];
              .id and
              .title and
              .priority and
              .category and
              (.steps | type == "array") and
              .expected_result and
              (.affected_files | type == "array") and
              (.automation_candidate | type == "boolean")
            )
          ' test-spec.json > /dev/null

          echo "Required schema: OK"    

      - name: Upload automated test specification
        uses: actions/upload-artifact@v4
        with:
          name: test-spec
          path: test-spec.json   

      - name: Extract automation candidates
        shell: bash
        run: |
          echo "================================"
          echo "Extracting automation candidates"
          echo "================================"

          TOTAL_TESTS=$(jq '.tests | length' test-spec.json)

          jq '{
            project: .project,
            tests: [
              .tests[]
              | select(.automation_candidate == true)
            ]
          }' test-spec.json > automated-tests.json

          AUTOMATED_TESTS=$(jq '.tests | length' automated-tests.json)
          MANUAL_TESTS=$((TOTAL_TESTS - AUTOMATED_TESTS))

          echo ""
          echo "Total test cases:       $TOTAL_TESTS"
          echo "Automation candidates:  $AUTOMATED_TESTS"
          echo "Manual-only tests:      $MANUAL_TESTS"
          echo ""

          echo "Automation candidate IDs:"
          jq -r '.tests[] | "\(.id) - \(.title)"' automated-tests.json

          echo ""
          echo "Automated test specification created:"
          wc -c automated-tests.json

          echo ""
          echo "Preview:"
          jq . automated-tests.json

      - name: Upload automation test specification
        uses: actions/upload-artifact@v4
        with:
          name: automated-tests
          path: automated-tests.json    

      - name: Validate automation test specification
        shell: bash
        run: |
          echo "================================"
          echo "Validating automation specification"
          echo "================================"

          echo ""
          echo "Checking JSON syntax..."

          jq empty automated-tests.json

          echo "JSON syntax: OK"

          echo ""
          echo "Checking test structure..."

          jq -e '
            .project
            and (.tests | type == "array")
          ' automated-tests.json > /dev/null

          echo "Root structure: OK"

          TOTAL=$(jq '.tests | length' automated-tests.json)

          if [ "$TOTAL" -eq 0 ]; then
            echo "ERROR: No automation tests found."
            exit 1
          fi

          echo "Automation tests found: $TOTAL"

          echo ""
          echo "Checking required fields..."

          jq -e '
            all(
              .tests[];
              (.id | type == "string")
              and
              (.title | type == "string")
              and
              (.priority | type == "string")
              and
              (.category | type == "string")
              and
              (.steps | type == "array")
              and
              (.expected_result | type == "string")
              and
              (.affected_files | type == "array")
              and
              (.automation_candidate == true)
            )
          ' automated-tests.json > /dev/null

          echo "Required fields: OK"

          echo ""
          echo "Checking test IDs..."

          jq -r '.tests[].id' automated-tests.json

          echo ""
          echo "================================"
          echo "Automation specification VALID"
          echo "================================"  

      - name: Set up Playwright
        shell: bash
        run: |
          echo "================================"
          echo "Setting up Playwright"
          echo "================================"

          echo ""
          echo "Node version:"
          node --version

          echo ""
          echo "npm version:"
          npm --version

          echo ""
          echo "Installing Playwright..."

          npm install --no-save @playwright/test

          echo ""
          echo "Installing Chromium..."

          npx playwright install chromium

          echo ""
          echo "Playwright setup completed successfully."     

      - name: Build Chrome extension
        shell: bash
        run: |
          echo "================================"
          echo "Building Chrome extension"
          echo "================================"

          cd tab-recorder-extension

          echo ""
          echo "Installing extension dependencies..."
          npm install

          echo ""
          echo "Building extension..."
          npm run build

          echo ""
          echo "Build completed."

          echo ""
          echo "Checking dist directory..."

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo ""
          echo "dist contents:"
          find dist -maxdepth 2 -type f | sort

          echo ""
          echo "Extension build verified successfully." 

      - name: Verify built extension files
        shell: bash
        run: |
          echo "================================"
          echo "Verifying built extension files"
          echo "================================"

          EXTENSION_DIR="tab-recorder-extension/dist"

          echo ""
          echo "Extension directory:"
          echo "$EXTENSION_DIR"

          if [ ! -d "$EXTENSION_DIR" ]; then
            echo "ERROR: Extension dist directory does not exist."
            exit 1
          fi

          echo ""
          echo "Files in extension dist:"
          find "$EXTENSION_DIR" -maxdepth 2 -type f | sort

          echo ""
          echo "Checking manifest.json..."

          if [ ! -f "$EXTENSION_DIR/manifest.json" ]; then
            echo "ERROR: manifest.json is missing."
            exit 1
          fi

          echo "manifest.json found."

          echo ""
          echo "Checking background.js..."

          if [ ! -f "$EXTENSION_DIR/background.js" ]; then
            echo "ERROR: background.js is missing from extension dist."
            echo ""
            echo "Expected:"
            echo "$EXTENSION_DIR/background.js"
            echo ""
            echo "Available JavaScript files:"
            find "$EXTENSION_DIR" -type f -name "*.js" | sort
            exit 1
          fi

          echo "background.js found."

          echo ""
          echo "Checking extension manifest..."

          node - <<'NODE'
          const fs = require('fs');

          const manifestPath = 'tab-recorder-extension/dist/manifest.json';
          const manifest = JSON.parse(
            fs.readFileSync(manifestPath, 'utf8')
          );

          console.log('Manifest version:', manifest.manifest_version);
          console.log('Extension name:', manifest.name);

          if (manifest.manifest_version !== 3) {
            console.error('ERROR: Extension is not Manifest V3.');
            process.exit(1);
          }

          if (!manifest.background) {
            console.error('ERROR: Manifest has no background configuration.');
            process.exit(1);
          }

          if (manifest.background.service_worker !== 'background.js') {
            console.error(
              'ERROR: Manifest service worker is not background.js.'
            );
            console.error(
              'Configured service worker:',
              manifest.background.service_worker
            );
            process.exit(1);
          }

          console.log(
            'Service worker:',
            manifest.background.service_worker
          );

          console.log('Manifest configuration VALID.');
          NODE

          echo ""
          echo "================================"
          echo "Built extension files VALID"
          echo "================================"

      - name: Generate Playwright tests
        shell: bash
        run: |
          echo "================================"
          echo "Generating Playwright tests"
          echo "================================"

          mkdir -p tests/generated

          python3 - <<'PY'
          import json
          import os

          AUTOMATED_TESTS = "automated-tests.json"
          OUTPUT_FILE = "tests/generated/extension.spec.js"

          with open(AUTOMATED_TESTS, "r", encoding="utf-8") as f:
              data = json.load(f)

          candidates = [
              t for t in data["tests"]
              if t.get("automation_candidate") is True
          ]

          if not candidates:
              raise RuntimeError("No automation candidates found.")

          print(f"Found {len(candidates)} automation candidates.")

          # ------------------------------------------------------------
          # PROOF OF CONCEPT
          # ------------------------------------------------------------
          # Only TC-001 is generated for the POC.
          # TC-001 verifies that the extension built in dist loads
          # successfully and that the initial BugScribe popup opens.
          # ------------------------------------------------------------

          tc001 = next(
              (t for t in candidates if t.get("id") == "TC-001"),
              None
          )

          if tc001 is None:
              raise RuntimeError(
                  "TC-001 is not present as an automation candidate."
              )

          print("Proof of concept: generating only TC-001.")

          # ------------------------------------------------------------
          # TC-001
          # ------------------------------------------------------------
          #
          # IMPORTANT:
          #
          # TC-001 is ONLY an extension-load verification.
          #
          # It must NOT:
          #   - click Chrome Extensions
          #   - look for an Enable button
          #   - navigate to chrome://extensions
          #   - test the floating widget
          #   - start recording
          #   - stop recording
          #   - test microphone permissions
          #   - test Save
          #   - test Azure DevOps
          #
          # The service worker proves the extension loaded.
          # popup.html proves the extension UI can be opened.
          #
          # Screenshots:
          #   - PASS screenshot after successful verification
          #   - FAIL screenshot when a test action/assertion fails
          #
          # ------------------------------------------------------------

          generated_test = r"""test(
            'TC-001 - Load extension in Chrome',
            async ({}, testInfo) => {
              let context;
              let page;

              try {
                context = await launchExtension();

                console.log('Checking extension service worker...');

                let serviceWorker = context.serviceWorkers()[0];

                if (!serviceWorker) {
                  serviceWorker = await context.waitForEvent(
                    'serviceworker',
                    {
                      timeout: 10000
                    }
                  );
                }

                expect(serviceWorker).toBeTruthy();

                const serviceWorkerUrl = serviceWorker.url();

                console.log(
                  'Extension service worker:',
                  serviceWorkerUrl
                );

                const extensionId = new URL(
                  serviceWorkerUrl
                ).host;

                expect(extensionId).toBeTruthy();

                console.log(
                  'Extension ID:',
                  extensionId
                );

                page = await context.newPage();

                const popupUrl =
                  'chrome-extension://' +
                  extensionId +
                  '/popup.html';

                console.log(
                  'Opening BugScribe popup:',
                  popupUrl
                );

                await page.goto(popupUrl);

                await expect(page).toHaveTitle(/BugScribe/i);

                await expect(
                  page.getByRole('heading', {
                    name: 'BugScribe'
                  })
                ).toBeVisible();

                await expect(
                  page.getByRole('button', {
                    name: 'Start Recording'
                  })
                ).toBeVisible();

                console.log(
                  'BugScribe extension loaded and initial popup UI verified.'
                );

                # ----------------------------------------------------
                # PASS SCREENSHOT
                # ----------------------------------------------------

                const passScreenshot =
                  testInfo.outputPath(
                    'TC-001-PASS.png'
                  );

                await page.screenshot({
                  path: passScreenshot,
                  fullPage: true
                });

                await testInfo.attach(
                  'TC-001 - PASS Screenshot',
                  {
                    path: passScreenshot,
                    contentType: 'image/png'
                  }
                );

                console.log(
                  'PASS screenshot captured:',
                  passScreenshot
                );

              } catch (error) {

                // ----------------------------------------------------
                // FAIL SCREENSHOT
                // ----------------------------------------------------

                if (
                  page &&
                  !page.isClosed()
                ) {
                  try {
                    const failScreenshot =
                      testInfo.outputPath(
                        'TC-001-FAIL.png'
                      );

                    await page.screenshot({
                      path: failScreenshot,
                      fullPage: true
                    });

                    await testInfo.attach(
                      'TC-001 - FAIL Screenshot',
                      {
                        path: failScreenshot,
                        contentType: 'image/png'
                      }
                    );

                    console.log(
                      'FAIL screenshot captured:',
                      failScreenshot
                    );

                  } catch (screenshotError) {
                    console.log(
                      'Unable to capture failure screenshot:',
                      screenshotError.message
                    );
                  }
                }

                throw error;

              } finally {

                if (context) {
                  await context.close();
                }
              }
            }
          );"""

          # ------------------------------------------------------------
          # VALIDATE GENERATED TEST
          # ------------------------------------------------------------

          required_checks = [
              ("TC-001", "TC-001"),
              ("launchExtension()", "launchExtension()"),
              ("expect(", "expect("),
              ("popup.html", "popup.html"),
              ("Start Recording", "Start Recording"),
              ("PASS screenshot", "TC-001-PASS.png"),
              ("FAIL screenshot", "TC-001-FAIL.png"),
              ("test attachment", "testInfo.attach"),
          ]

          for description, value in required_checks:
              if value not in generated_test:
                  raise RuntimeError(
                      f"Generated TC-001 is missing required content: {description}"
                  )

          forbidden_checks = [
              ("test.skip(", "test.skip()"),
              ("test.fixme(", "test.fixme()"),
              ("chrome://extensions", "chrome://extensions"),
              ("headless: false", "headless: false"),
              ("chromium.launch(", "chromium.launch()"),
              ("chromium.launchPersistentContext(", "chromium.launchPersistentContext()"),
              ("Enable", "Enable button flow"),
              ("floating-widget", "floating widget"),
              ("Create Bug in Azure DevOps", "Azure DevOps flow"),
          ]

          for value, description in forbidden_checks:
              if value in generated_test:
                  raise RuntimeError(
                      f"Generated TC-001 contains forbidden content: {description}"
                  )

          # ------------------------------------------------------------
          # CREATE FINAL PLAYWRIGHT FILE
          # ------------------------------------------------------------

          header = """const { test, expect } = require('@playwright/test');
          const { launchExtension } = require('../../test/fixtures/extension');

          test.describe('BugScribe Chrome Extension Tests', () => {
          """

          footer = """
          });
          """

          body = "\n\n".join(
              "  " + line if line.strip() else ""
              for line in generated_test.splitlines()
          )

          content = (
              header
              + "\n"
              + body
              + "\n"
              + footer
          )

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(content)

          print("")
          print("================================")
          print("Playwright tests generated.")
          print("================================")
          print("")
          print("Generated test count: 1")
          print("Generated test ID: TC-001")
          print("Screenshot support:")
          print("  PASS screenshot: ENABLED")
          print("  FAIL screenshot: ENABLED")
          print(f"Output: {OUTPUT_FILE}")

          print("")
          print("Generated test:")
          print(content)
          PY

          echo ""
          echo "================================"
          echo "Validating generated JavaScript"
          echo "================================"

          TEST_FILE="tests/generated/extension.spec.js"

          if [ ! -f "$TEST_FILE" ]; then
            echo "ERROR: Generated Playwright test file not found."
            exit 1
          fi

          node --check "$TEST_FILE"

          echo ""
          echo "Checking TC-001..."

          if ! grep -q "TC-001" "$TEST_FILE"; then
            echo "ERROR: TC-001 was not generated."
            exit 1
          fi

          if ! grep -q "launchExtension()" "$TEST_FILE"; then
            echo "ERROR: launchExtension() is not used."
            exit 1
          fi

          if ! grep -q "popup.html" "$TEST_FILE"; then
            echo "ERROR: popup.html is not tested."
            exit 1
          fi

          if ! grep -q "Start Recording" "$TEST_FILE"; then
            echo "ERROR: Start Recording control is not verified."
            exit 1
          fi

          echo ""
          echo "Checking screenshot support..."

          if ! grep -q "TC-001-PASS.png" "$TEST_FILE"; then
            echo "ERROR: PASS screenshot is not configured."
            exit 1
          fi

          if ! grep -q "TC-001-FAIL.png" "$TEST_FILE"; then
            echo "ERROR: FAIL screenshot is not configured."
            exit 1
          fi

          if ! grep -q "testInfo.attach" "$TEST_FILE"; then
            echo "ERROR: Playwright screenshot attachment is not configured."
            exit 1
          fi

          if grep -q "test.skip(" "$TEST_FILE"; then
            echo "ERROR: test.skip() found."
            exit 1
          fi

          if grep -q "test.fixme(" "$TEST_FILE"; then
            echo "ERROR: test.fixme() found."
            exit 1
          fi

          if grep -q "headless: false" "$TEST_FILE"; then
            echo "ERROR: headless: false found."
            exit 1
          fi

          if grep -q "chrome://extensions" "$TEST_FILE"; then
            echo "ERROR: chrome://extensions found."
            exit 1
          fi

          if grep -q "floating-widget" "$TEST_FILE"; then
            echo "ERROR: floating widget logic found in TC-001."
            exit 1
          fi

          if grep -q "Create Bug in Azure DevOps" "$TEST_FILE"; then
            echo "ERROR: Azure DevOps logic found in TC-001."
            exit 1
          fi

          echo ""
          echo "================================"
          echo "Generated Playwright test VALID"
          echo "================================"

          echo ""
          echo "Screenshot reporting: ENABLED"

          echo ""
          echo "Final generated file:"
          cat "$TEST_FILE"

      - name: Validate generated Playwright tests
        shell: bash
        run: |
          echo "================================"
          echo "Validating generated Playwright tests"
          echo "================================"

          TEST_FILE="tests/generated/extension.spec.js"
          EXPECTED_ID="TC-001"

          if [ ! -f "$TEST_FILE" ]; then
            echo "ERROR: Generated Playwright test file not found:"
            echo "$TEST_FILE"
            exit 1
          fi

          echo ""
          echo "Generated test file found:"
          echo "$TEST_FILE"

          echo ""
          echo "Proof-of-concept validation"
          echo "Expected test ID: $EXPECTED_ID"

          echo ""
          echo "Checking IDs found in generated Playwright tests..."

          GENERATED_IDS=$(grep -oE 'TC-[A-Za-z0-9]{3,4}' "$TEST_FILE" | sort -u)

          if [ -z "$GENERATED_IDS" ]; then
            echo "ERROR: No test case IDs found in generated Playwright tests."
            exit 1
          fi

          echo ""
          echo "IDs found in generated Playwright:"
          echo "$GENERATED_IDS"

          echo ""
          echo "Checking expected test..."

          if ! echo "$GENERATED_IDS" | grep -qx "$EXPECTED_ID"; then
            echo "ERROR: Expected generated test $EXPECTED_ID was not found."
            exit 1
          fi

          echo "Found expected test: $EXPECTED_ID"

          echo ""
          echo "Checking for unexpected test IDs..."

          UNEXPECTED=0

          while IFS= read -r ID; do
            if [ "$ID" != "$EXPECTED_ID" ]; then
              echo "ERROR: Unexpected test ID generated: $ID"
              UNEXPECTED=1
            fi
          done <<< "$GENERATED_IDS"

          if [ "$UNEXPECTED" -ne 0 ]; then
            echo ""
            echo "ERROR: Generated Playwright contains tests other than $EXPECTED_ID."
            exit 1
          fi

          echo ""
          echo "Checking browser headless configuration..."

          if grep -qE 'headless[[:space:]]*:[[:space:]]*false' "$TEST_FILE"; then
            echo "ERROR: Generated Playwright test uses headless: false."
            echo "GitHub Actions requires headless Chromium."
            exit 1
          fi

          if grep -q -- "--headed" "$TEST_FILE"; then
            echo "ERROR: Generated Playwright test contains --headed."
            echo "GitHub Actions requires headless Chromium."
            exit 1
          fi

          echo "Headless browser configuration VALID."

          echo ""
          echo "Checking Playwright syntax..."

          node --check "$TEST_FILE"

          echo ""
          echo "Checking required Playwright assertion..."

          if ! grep -q "expect(" "$TEST_FILE"; then
            echo "ERROR: Generated test does not contain an expect() assertion."
            exit 1
          fi

          echo ""
          echo "Checking that test.skip() is not used..."

          if grep -q "test.skip(" "$TEST_FILE"; then
            echo "ERROR: Generated test contains test.skip()."
            exit 1
          fi

          echo ""
          echo "Checking that test.fixme() is not used..."

          if grep -q "test.fixme(" "$TEST_FILE"; then
            echo "ERROR: Generated test contains test.fixme()."
            exit 1
          fi

          echo ""
          echo "================================"
          echo "Generated Playwright tests VALID"
          echo "================================"
          echo "Validated test: $EXPECTED_ID"

      - name: Run Playwright tests
        shell: bash
        run: |
          echo "================================"
          echo "Running Playwright tests"
          echo "================================"

          echo ""
          echo "Generated Playwright test file:"
          echo "--------------------------------"

          cat tests/generated/extension.spec.js

          echo ""
          echo "--------------------------------"
          echo "Running Playwright"
          echo "--------------------------------"

          mkdir -p playwright-report test-results

          npx playwright test tests/generated/extension.spec.js \
            --reporter=line,json,html \
            --output=test-results \
            > playwright-output.txt 2>&1 || TEST_EXIT_CODE=$?

          cat playwright-output.txt

          echo ""
          echo "================================"
          echo "Playwright Summary"
          echo "================================"

          if [ -f test-results.json ]; then
            jq '{
              expected: .stats.expected,
              unexpected: .stats.unexpected,
              skipped: .stats.skipped,
              flaky: .stats.flaky
            }' test-results.json || true
          fi

          if [ -n "${TEST_EXIT_CODE:-}" ]; then
            echo ""
            echo "Playwright tests failed."
            exit "$TEST_EXIT_CODE"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/          