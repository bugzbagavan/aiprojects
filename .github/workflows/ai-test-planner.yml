            exit 1
          fi

          echo ""
          echo "Generated test file:"
          echo "--------------------------------"
          cat "$TEST_FILE"
          echo "--------------------------------"

          echo ""
          echo "Checking test count..."

          TEST_COUNT=$(grep -cE "^[[:space:]]*test\\(" "$TEST_FILE" || true)

          if [ "$TEST_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 generated Playwright test."
            echo "Found: $TEST_COUNT"
            exit 1
          fi

          echo "Test count VALID: $TEST_COUNT"

          echo ""
          echo "Checking TC-001..."

          if ! grep -q "TC-001" "$TEST_FILE"; then
            echo "ERROR: TC-001 was not generated."
            exit 1
          fi

          echo "TC-001 VALID."

          echo ""
          echo "Checking browser headless configuration..."

          if grep -qE 'headless[[:space:]]*:[[:space:]]*false' "$TEST_FILE"; then
            echo "ERROR: Generated Playwright test uses headless: false."
            echo "GitHub Actions requires headless Chromium."
            exit 1
          fi

          if grep -q -- "--headed" "$TEST_FILE"; then
            echo "ERROR: Generated Playwright test contains --headed."
            echo "GitHub Actions requires headless Chromium."
            exit 1
          fi

          if grep -q "chromium.launchPersistentContext" "$TEST_FILE"; then
            echo "ERROR: Generated test launches Chromium directly."
            echo "The launchExtension fixture must be used."
            exit 1
          fi

          echo "Headless browser configuration VALID."

          echo ""
          echo "Checking extension fixture usage..."

          if ! grep -q "require('../../test/fixtures/extension')" "$TEST_FILE"; then
            echo "ERROR: Generated test does not import the extension fixture."
            exit 1
          fi

          if ! grep -q "launchExtension()" "$TEST_FILE"; then
            echo "ERROR: Generated test does not use launchExtension()."
            exit 1
          fi

          echo "Extension fixture usage VALID."

          echo ""
          echo "Checking JavaScript syntax..."

